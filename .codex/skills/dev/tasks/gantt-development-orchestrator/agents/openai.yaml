interface:
  display_name: "大規模ガントのカテゴリ別運営"
  short_description: "単体ID PMの完遂とカテゴリ間調整・原工程への自律復帰を運営"
  default_prompt: "$gantt-development-orchestrator を使って、承認済みの全管理IDを単一正本で確認し、カテゴリオーケストラと元ID一つごとの新規chatのPM・限定ワーカーの責任を保って進めてください。必要な起動文を正本から組み立て、阻害は実成果の受入と同IDの実再開まで閉じてください。起点を上位や報告先にせず、開始・通信・移管・点検タイマー・課金は実際の許可範囲に限ってください。"
