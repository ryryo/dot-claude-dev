interface:
  display_name: "ChatGPT GitHub Task"
  short_description: "GitHub接続のProで相談・Issue化し、許可された改修をPRにする"
  default_prompt: "Use $chatgpt-github-task to read connected GitHub code, consult or create Codex issues, and deliver minor fixes as PRs. When the user explicitly authorizes Pro itself to make broader changes and a PR, complete that scoped work instead of defaulting to an issue. Respect consultation-only requests and do not infer write permission from skill invocation alone."
policy:
  allow_implicit_invocation: true
